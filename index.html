    <title>Eruliaf - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; }
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; }
        .hero { 
            padding: 30px; 
            text-align: center; 
            border-radius: 10px; 
            margin-bottom: 30px; 
            max-width: 1100px; 
            margin-left: auto;
            margin-right: auto;
        }
        .grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
        .card { width: 220px; padding: 15px; border-radius: 10px; text-align: center; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        
        
        .card-img { 
            height: 130px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background-color: #f8f9fa; 
        }
        
        .star-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 2;
        }
        .star-toggle svg { stroke: #666; fill: none; transition: all 0.2s ease; }
        .star-toggle.starred svg { stroke: #f59e0b; fill: #f59e0b; }

        .panel { display: none; position: fixed; right: 0; top: 0; width: 240px; height: 100%; padding: 25px; box-shadow: -4px 0 15px rgba(0,0,0,0.15); z-index: 100; background: white; }
        .panel.show { display: block; }
        
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px; 
            padding: 12px 24px; 
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #e9ecef;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 18px; 
            transition: all 0.2s ease;
        }

        .nav-link.active {
            background-color: #4a4a4a;
            color: #ffffff;
            border-color: #4a4a4a;
        }

        .nav-link:hover:not(.active) {
            background-color: #dee2e6;
        }
    </style>
</head>

        let starredIds = JSON.parse(localStorage.getItem("starredAchievers")) || [];

        function shuffleArray(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        function renderCards(data) {
            const grid = document.getElementById("achiever-grid");
            grid.innerHTML = "";

            data.forEach(item => {
                const isStarred = starredIds.includes(item.id);
                const card = document.createElement("div");
                card.className = "card form-container";
                card.innerHTML = `
                    <button class="star-toggle ${isStarred ? 'starred' : ''}" onclick="toggleStar('${item.id}')" title="Star Achiever">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
                    </button>
                    <div class="card-img form-blob">
                        <img src="${item.img}" alt="${item.name}" style="max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 8px; display: block;">
                    </div>
                    <h4>${item.name}</h4>
                    <p style="color:#666; font-size:14px;">${item.meta}</p>
                    <a href="${item.page}" style="text-decoration: none; width: 100%; margin-top: 10px;">
                        <button class="form-btn form-btn--submit" style="width:100%; padding:8px; border-radius:5px; cursor:pointer;">View Profile</button>
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        function toggleStar(id) {
            if (starredIds.includes(id)) {
                starredIds = starredIds.filter(item => item !== id);
            } else {
                starredIds.push(id);
            }
            localStorage.setItem("starredAchievers", JSON.stringify(starredIds));
            renderCards(currentData);
        }

        function filterAchievers() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = currentData.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.meta.toLowerCase().includes(query)
            );
            renderCards(filtered);
        }

        function toggleSettings() {
            document.getElementById('settings').classList.toggle('show');
        }

        function handleLogout() {
            window.location.href = "index.html";
        }

        const currentPage = window.location.pathname.split("/").pop();
        if (currentPage === "browse.html") {
            document.getElementById("nav-browse").classList.add("active");
        } else if (currentPage === "starred.html") {
            document.getElementById("nav-starred").classList.add("active");
        } else {
            document.getElementById("nav-home").classList.add("active");
        }

        const currentData = shuffleArray([...achieversData]).slice(0, 4);
        renderCards(currentData);
